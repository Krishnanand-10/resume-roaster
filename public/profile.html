<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings — Resume Roaster</title>
    <meta name="description" content="Manage your Resume Roaster profile, account settings, and sign out.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="app-body">
    <!-- AMBIENT VOLCANIC GLOW ORBS -->
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-center"></div>

    <div class="app-page-container">
        <!-- TOP BRAND NAV -->
        <nav class="top-nav">
            <a href="/" class="brand-badge-link" title="Back to Home">
                <div class="brand-badge">
                    <span class="flame-pulse">🔥</span>
                    <span class="brand-text">RESUME ROASTER</span>
                </div>
            </a>
            <div class="nav-right">
                <a href="/app" class="profile-back-link" title="Back to Roaster">
                    <span>← Back to Roaster</span>
                </a>
            </div>
        </nav>

        <!-- PROFILE SETTINGS CONTENT -->
        <main class="profile-settings-page">

            <div class="profile-page-header">
                <h1 class="profile-page-title">Profile Settings</h1>
                <p class="profile-page-subtitle">Manage your account and preferences</p>
            </div>

            <!-- PROFILE CARD -->
            <section class="terminal-card profile-card">
                <div class="profile-card-top">
                    <div class="profile-avatar-large" id="profileAvatarLarge">
                        <img class="profile-avatar-img-lg" id="profileAvatarImgLg" src="" alt="Avatar" style="display: none;">
                        <span class="profile-avatar-initial-lg" id="profileAvatarInitialLg">U</span>
                    </div>
                    <div class="profile-user-details">
                        <h2 class="profile-display-name" id="profileDisplayName">Loading...</h2>
                        <span class="profile-email" id="profileEmail">loading@example.com</span>
                        <span class="profile-google-badge">
                            <svg width="14" height="14" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                            </svg>
                            Google Authenticated
                        </span>
                    </div>
                </div>

                <div class="profile-divider"></div>

                <button type="button" class="profile-signout-btn" id="profileSignOutBtn">
                    <span>Sign Out</span>
                </button>
            </section>

            <!-- DANGER ZONE -->
            <section class="terminal-card danger-zone-card">
                <div class="danger-zone-header">
                    <h3 class="danger-zone-title">Danger Zone</h3>
                </div>

                <div class="danger-zone-body">
                    <div class="danger-info">
                        <h4 class="danger-action-title">Delete Account</h4>
                        <p class="danger-warning-text">
                            Permanently removes your account and all history. <strong>Irreversible.</strong>
                        </p>
                    </div>
                    <button type="button" class="danger-delete-btn" id="dangerDeleteBtn">
                        <span>Delete Account</span>
                    </button>
                </div>
            </section>

        </main>
    </div>

    <script src="profile.js"></script>
</body>
</html>
