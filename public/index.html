<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Roaster - AI Resume Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔥 Resume Roaster</h1>
            <p>Upload your resume to receive AI feedback and critique</p>
        </div>

        <div class="tabs">
            <button type="button" class="tab-btn active" id="tabUpload">Upload File (.PDF / .TXT)</button>
            <button type="button" class="tab-btn" id="tabPaste">Paste Raw Text</button>
        </div>

        <form id="roastForm">
            <div class="tab-content active" id="contentUpload">
                <div class="dropzone" id="dropzone">
                    <div class="dropzone-icon">📄</div>
                    <p>Drag & drop your resume file here, or <span>browse</span></p>
                    <p style="font-size: 0.8rem; margin-top: 0.25rem;">Supports PDF and TXT files</p>
                    <div class="file-selected" id="fileNameDisplay"></div>
                </div>
                <input type="file" id="fileInput" accept=".pdf,.txt">
            </div>

            <div class="tab-content" id="contentPaste">
                <textarea id="textInput" placeholder="Paste your resume contents here..."></textarea>
            </div>

            <div class="options-group">
                <label for="roastMode">Roast Mode:</label>
                <select id="roastMode">
                    <option value="savage">🔥 Savage Roast (Brutally Honest)</option>
                    <option value="recruiter">💼 Recruiter Critique (Professional)</option>
                    <option value="polish">✨ Executive Polish (Constructive)</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Process Resume 🔥</button>
        </form>

        <div class="error-message" id="errorMessage"></div>

        <div id="resultContainer">
            <div class="result-header">
                <h3>✅ Resume Extracted</h3>
                <div class="stats-badge">
                    <span>Words: <strong id="statWords">0</strong></span>
                    <span>Characters: <strong id="statChars">0</strong></span>
                </div>
            </div>
            <div class="preview-box" id="previewBox"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
